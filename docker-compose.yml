services:
  # Single-node Kafka broker running in KRaft mode (no ZooKeeper required).
  kafka:
    image: apache/kafka:3.8.0
    container_name: risk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot init job: explicitly creates the two topics so the demo doesn't
  # rely purely on auto-creation racing the first producer/consumer message.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.raw --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.scored --partitions 3 --replication-factor 1 &&
      echo 'topics ready'
      "

  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: risk-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: transactions.raw
    command: ["--rate", "10", "--fraud-rate", "0.03"]
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: risk-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: transactions.raw
      KAFKA_SCORED_TOPIC: transactions.scored
      KAFKA_CONSUMER_GROUP: risk-scorer
      STATS_DB_PATH: /data/stats.db
      MODEL_PATH: /app/training/model.pkl
    volumes:
      - stats-data:/data
      - ./training:/app/training:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: risk-api
    depends_on:
      - consumer
    environment:
      STATS_DB_PATH: /data/stats.db
      MODEL_PATH: /app/training/model.pkl
    volumes:
      - stats-data:/data
      - ./training:/app/training:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  stats-data:
